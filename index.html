/* ================= WEB CANVAS ================= */
function WebBackground({ th }) {
  const ref = useRef(null);
  const mouse = useRef({ x: -999, y: -999 });
  const scrollY = useRef(0);
  const ripples = useRef([]);
  const thRef = useRef(th);
  useEffect(() => { thRef.current = th; }, [th]);
  useEffect(() => {
    const canvas = ref.current; if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let raf, W, H, dpr = Math.min(window.devicePixelRatio || 1, 2), nodes = [], shots = [], spiders = [], t = 0;
    const drawSpider = (x, y, s, col) => {
      ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(x, y, s * 1.4, s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x, y - s * 1.5, s * 0.8, 0, Math.PI * 2); ctx.fill();
      for (let k = 0; k < 4; k++) { const dy = -s * 0.6 + k * s * 0.6;
        ctx.beginPath(); ctx.moveTo(x, y + dy * 0.4); ctx.lineTo(x - s * 2.2, y + dy - s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y + dy * 0.4); ctx.lineTo(x + s * 2.2, y + dy - s); ctx.stroke(); }
    };
    const resize = () => {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + "px"; canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(120, Math.max(60, Math.floor((W * H) / 16000)));
      nodes = Array.from({ length: count }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35, depth: 0.4 + Math.random() * 0.6, ph: Math.random() * Math.PI * 2 }));
      spiders = Array.from({ length: 3 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, s: 2.5 + Math.random() * 2.5, ph: Math.random() * Math.PI * 2 }));
    };
    const py = (n, sOff) => ((((n.y - sOff * 0.12 * n.depth) % H) + H) % H);
    const draw = () => {
      t += 1; const TH = thRef.current, sOff = scrollY.current, mx = mouse.current.x, my = mouse.current.y;
      ctx.clearRect(0, 0, W, H);
      if (t % 24 === 0 && shots.length < 8 && nodes.length > 1) { const a = nodes[(Math.random() * nodes.length) | 0], b = nodes[(Math.random() * nodes.length) | 0]; if (a !== b) shots.push({ a, b, life: 0, max: 45 }); }
      ripples.current = ripples.current.filter(r => r.life < r.max);
      for (const r of ripples.current) { r.life++; const rad = (r.life / r.max) * 280; ctx.strokeStyle = `rgba(${TH.web},${0.5 * (1 - r.life / r.max)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.stroke(); }
      for (const n of nodes) {
        n.x += n.vx; n.y += n.vy; if (n.x < 0 || n.x > W) n.vx *= -1; if (n.y < 0 || n.y > H) n.vy *= -1;
        const yy = py(n, sOff); let rx = n.x, ry = yy;
        const ddx = n.x - mx, ddy = yy - my, dd = Math.hypot(ddx, ddy);
        if (dd < 170 && dd > 0) { const f = (170 - dd) / 170 * 48; rx += (ddx / dd) * f; ry += (ddy / dd) * f; }
        for (const r of ripples.current) { const rad = (r.life / r.max) * 280, ex = n.x - r.x, ey = yy - r.y, ed = Math.hypot(ex, ey); if (Math.abs(ed - rad) < 50 && ed > 0) { const f = (50 - Math.abs(ed - rad)) / 50 * 26; rx += (ex / ed) * f; ry += (ey / ed) * f; } }
        n._rx = rx; n._ry = ry; n._dd = dd;
      }
      for (let i = 0; i < nodes.length; i++) { const n = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) { const m = nodes[j]; const d = Math.hypot(n._rx - m._rx, n._ry - m._ry);
          if (d < 150) { const near = Math.min(n._dd, m._dd) < 170; ctx.strokeStyle = near ? `rgba(${TH.web},${0.2 * (1 - d / 150)})` : `rgba(${TH.node},${0.07 * (1 - d / 150)})`; ctx.lineWidth = near ? 0.9 : 0.6; ctx.beginPath(); ctx.moveTo(n._rx, n._ry); ctx.lineTo(m._rx, m._ry); ctx.stroke(); } } }
      for (const n of nodes) {
        if (n._dd < 200) { ctx.strokeStyle = `rgba(${TH.web},${0.5 * (1 - n._dd / 200)})`; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.moveTo(n._rx, n._ry); ctx.lineTo(mx, my); ctx.stroke(); }
        const pulse = 1.4 + Math.sin(t * 0.03 + n.ph) * 0.6; ctx.beginPath(); ctx.arc(n._rx, n._ry, pulse * n.depth + 0.5, 0, Math.PI * 2); ctx.fillStyle = `rgba(${TH.node},${0.32 * n.depth + 0.14})`; ctx.fill();
      }
      shots = shots.filter(s => s.life < s.max);
      for (const s of shots) { s.life++; const p = s.life / s.max; const ay = py(s.a, sOff), by = py(s.b, sOff);
        const cx = s.a.x + (s.b.x - s.a.x) * Math.min(1, p * 1.6), cy = ay + (by - ay) * Math.min(1, p * 1.6); const fade = p < 0.6 ? 1 : 1 - (p - 0.6) / 0.4;
        ctx.strokeStyle = `rgba(${TH.web},${0.5 * fade})`; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(s.a.x, ay); ctx.lineTo(cx, cy); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, 2 * fade, 0, Math.PI * 2); ctx.fillStyle = `rgba(${TH.web},${0.7 * fade})`; ctx.fill(); }
      for (const sp of spiders) { sp.x += sp.vx; sp.y += sp.vy + Math.sin(t * 0.02 + sp.ph) * 0.15;
        if (sp.x < -20) sp.x = W + 20; if (sp.x > W + 20) sp.x = -20; if (sp.y < -20) sp.y = H + 20; if (sp.y > H + 20) sp.y = -20;
        const sy = ((((sp.y - sOff * 0.16)) % (H + 40)) + (H + 40)) % (H + 40) - 20;
        ctx.strokeStyle = `rgba(${TH.node},0.06)`; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(sp.x, sy - sp.s * 2.2); ctx.lineTo(sp.x, sy - 200); ctx.stroke();
        drawSpider(sp.x, sy, sp.s, `rgba(${TH.web},0.5)`); }
      raf = requestAnimationFrame(draw);
    };
    const mv = e => { mouse.current.x = e.clientX; mouse.current.y = e.clientY; };
    const ml = () => { mouse.current.x = -999; mouse.current.y = -999; };
    const sc = () => scrollY.current = window.scrollY;
    const cl = e => ripples.current.push({ x: e.clientX, y: e.clientY, life: 0, max: 40 });
    resize(); draw();
    window.addEventListener("resize", resize); window.addEventListener("pointermove", mv, { passive: true }); window.addEventListener("pointerout", ml); window.addEventListener("scroll", sc, { passive: true }); window.addEventListener("pointerdown", cl, { passive: true });
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); window.removeEventListener("pointermove", mv); window.removeEventListener("pointerout", ml); window.removeEventListener("scroll", sc); window.removeEventListener("pointerdown", cl); };
  }, []);
  return <canvas ref={ref} style={{ position: "fixed", inset: 0, zIndex: 1, pointerEvents: "none" }} />;
}

/* ================= CINEMATIC INTRO (web-shatter) ================= */
function CinematicIntro({ th, mono, display, onDone }) {
  const [stage, setStage] = useState(0);
  const started = useRef(false);
  useEffect(() => {
    if (started.current) return; started.current = true;
    const t1 = setTimeout(() => setStage(1), 2200);
    const t2 = setTimeout(() => setStage(2), 3200);
    const t3 = setTimeout(onDone, 4100);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
  }, [onDone]);
  const cx = 50, cy = 44, SPOKES = 20, RINGS = [6, 13, 21, 31, 43, 57, 73, 92];
  const shards = [];
  for (let s = 0; s < SPOKES; s++) { const a0 = (s / SPOKES) * Math.PI * 2, a1 = ((s + 1) / SPOKES) * Math.PI * 2;
    for (let r = 0; r < RINGS.length - 1; r++) { const r0 = RINGS[r], r1 = RINGS[r + 1], mid = (a0 + a1) / 2, midR = (r0 + r1) / 2, dirX = Math.cos(mid), dirY = Math.sin(mid);
      shards.push({ id: `${s}-${r}`, pts: [[cx + Math.cos(a0) * r0 * 0.9, cy + Math.sin(a0) * r0 * 0.9],[cx + Math.cos(a1) * r0 * 0.9, cy + Math.sin(a1) * r0 * 0.9],[cx + Math.cos(a1) * r1 * 0.9, cy + Math.sin(a1) * r1 * 0.9],[cx + Math.cos(a0) * r1 * 0.9, cy + Math.sin(a0) * r1 * 0.9]], tx: dirX * (90 + midR * 1.8), ty: dirY * (90 + midR * 1.8) + 30, rot: (Math.random() - 0.5) * 360, delay: r * 0.03 + Math.random() * 0.04 }); } }
  const spokeLines = Array.from({ length: SPOKES }, (_, i) => { const a = (i / SPOKES) * Math.PI * 2; return { x2: cx + Math.cos(a) * 75, y2: cy + Math.sin(a) * 75 }; });
  const ringPolys = RINGS.map(r => Array.from({ length: SPOKES }, (_, i) => { const a = (i / SPOKES) * Math.PI * 2; return `${cx + Math.cos(a) * r},${cy + Math.sin(a) * r}`; }).join(" "));
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 9000, pointerEvents: "none" }}>
      {stage < 2 && (
        <div style={{ position: "absolute", inset: 0, background: th.accent, overflow: "hidden", animation: stage === 1 ? "coverFlash .9s ease forwards, crackShake .9s ease forwards" : "none" }}>
          <div style={{ position: "absolute", inset: 0, opacity: 0.12, backgroundImage: "radial-gradient(#000 2px, transparent 2px)", backgroundSize: "16px 16px" }} />
          <div style={{ position: "absolute", inset: 0, background: "repeating-linear-gradient(115deg, transparent 0 60px, rgba(0,0,0,0.05) 60px 120px)" }} />
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", animation: "coverPop .7s cubic-bezier(.2,.9,.3,1.5) .1s both" }}>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontFamily: display, fontSize: "9vw", color: "#fff", textTransform: "uppercase", letterSpacing: -4, lineHeight: 0.85, textShadow: "6px 6px 0 rgba(0,0,0,0.28)", whiteSpace: "nowrap" }}>THE DATA SLINGER</div>
              <div style={{ fontFamily: mono, fontSize: "1.4vw", letterSpacing: 8, color: "#fff", marginTop: "1.5vw", opacity: 0.9 }}>ADITYA MARATHE</div>
            </div>
          </div>
          {stage === 1 && (
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }}>
              {spokeLines.map((l, i) => (<line key={i} x1={cx} y1={cy} x2={l.x2} y2={l.y2} stroke="rgba(255,255,255,0.95)" strokeWidth="0.5" vectorEffect="non-scaling-stroke" style={{ strokeDasharray: 120, strokeDashoffset: 120, animation: `crackGrow .45s ease-out ${i * 0.012}s forwards` }} />))}
              {ringPolys.map((p, i) => (<polygon key={i} points={p} fill="none" stroke="rgba(255,255,255,0.85)" strokeWidth="0.4" vectorEffect="non-scaling-stroke" style={{ opacity: 0, animation: `crackRing .35s ease-out ${0.18 + i * 0.045}s forwards` }} />))}
            </svg>
          )}
        </div>
      )}
      {stage === 2 && <div style={{ position: "absolute", inset: 0, background: "#fff", animation: "flashBurst .5s ease-out forwards" }} />}

/* ================= CURSOR ================= */
function WebCursor({ th }) {
  const dot = useRef(null), ring = useRef(null); const [down, setDown] = useState(false);
  useEffect(() => {
    let rx = 0, ry = 0, mx = 0, my = 0, raf;
    const move = e => { mx = e.clientX; my = e.clientY; if (dot.current) dot.current.style.transform = `translate(${mx}px,${my}px)`; };
    const loop = () => { rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18; if (ring.current) ring.current.style.transform = `translate(${rx}px,${ry}px)`; raf = requestAnimationFrame(loop); };
    const d = () => setDown(true), u = () => setDown(false);
    window.addEventListener("pointermove", move); window.addEventListener("pointerdown", d); window.addEventListener("pointerup", u); loop();
    return () => { cancelAnimationFrame(raf); window.removeEventListener("pointermove", move); window.removeEventListener("pointerdown", d); window.removeEventListener("pointerup", u); };
  }, []);
  const base = { position: "fixed", top: 0, left: 0, zIndex: 9999, pointerEvents: "none", borderRadius: "50%" };
  return (<React.Fragment>
    <div ref={dot} style={{ ...base, width: 7, height: 7, background: th.accent, boxShadow: `0 0 12px ${th.accent}`, marginTop: -3.5, marginLeft: -3.5 }} />
    <div ref={ring} style={{ ...base, width: down ? 24 : 34, height: down ? 24 : 34, border: `1.5px solid ${th.accent}`, marginTop: down ? -12 : -17, marginLeft: down ? -12 : -17, transition: "width .15s, height .15s, margin .15s", opacity: 0.7 }} />

}

/* ================= HOOKS ================= */
function useInView(threshold = 0.2, once = true) {
  const ref = useRef(null); const [seen, setSeen] = useState(false);
  useEffect(() => { const el = ref.current; if (!el) return;
    const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); if (once) o.unobserve(el); } }, { threshold });
    o.observe(el); return () => o.disconnect();
  }, [threshold, once]);
  return [ref, seen];
}
function Reveal({ children, delay = 0, from = "up" }) {
  const [ref, seen] = useInView(0.15);
  const off = { up: "translateY(34px)", left: "translateX(-44px)", right: "translateX(44px)", scale: "scale(0.92)" }[from] || "translateY(34px)";
  return <div ref={ref} style={{ opacity: seen ? 1 : 0, transform: seen ? "none" : off, transition: `opacity .7s cubic-bezier(.2,.7,.2,1) ${delay}s, transform .8s cubic-bezier(.2,.8,.2,1) ${delay}s` }}>{children}</div>;
}
function Counter({ value, suffix = "", decimals = 0 }) {
  const [ref, seen] = useInView(0.5); const [n, setN] = useState(0);
  useEffect(() => { if (!seen) return; let raf, start;
    const tick = ts => { if (!start) start = ts; const p = Math.min((ts - start) / 1400, 1); setN(value * (1 - Math.pow(1 - p, 3))); if (p < 1) raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf);
  }, [seen, value]);
  return <span ref={ref}>{decimals > 0 ? n.toFixed(decimals) : Math.round(n).toLocaleString()}{suffix}</span>;
}

function Section({ id, num, title, mono, display, th, children }) {

function ImpactCell({ m, i, last, th, mono, display }) {
  const [hov, setHov] = useState(false); const [ref, seen] = useInView(0.4);
  return (
    <div ref={ref} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)} style={{ position: "relative", textAlign: "center", borderRight: !last ? `1px solid rgba(${th.node},0.08)` : "none", overflow: "hidden", opacity: seen ? 1 : 0, transform: seen ? "none" : "scale(0.7) translateY(20px)", transition: `opacity .6s ease ${i * 0.12}s, transform .6s cubic-bezier(.2,.9,.3,1.4) ${i * 0.12}s` }} className="impact-cell">
      {hov && <span style={{ position: "absolute", left: "50%", top: "42%", width: 20, height: 20, marginLeft: -10, marginTop: -10, borderRadius: "50%", border: `2px solid ${th.accent}`, pointerEvents: "none", animation: "sensePulse .7s ease-out forwards" }} />}
      <div style={{ fontFamily: display, fontSize: "clamp(26px,4vw,40px)", color: i % 2 === 0 ? th.accent : "#fff", letterSpacing: -1, textShadow: hov ? `0 0 24px ${th.accent}` : (i % 2 === 0 ? `0 0 20px ${th.accent}55` : "none"), transform: hov ? "scale(1.08)" : "scale(1)", transition: "transform .3s, text-shadow .3s" }}><Counter value={m.val} suffix={m.suffix} decimals={m.decimals || 0} /></div>
      <div style={{ fontFamily: mono, fontSize: 11, color: "#8b96b0", marginTop: 6, letterSpacing: 0.5, textTransform: "uppercase" }}>{m.label}</div>
    </div>
  );
}

function Project({ p, mono, display, th, open, onToggle }) {
  const [hov, setHov] = useState(false); const [pulses, setPulses] = useState([]); const [caseOpen, setCaseOpen] = useState(false); const [ref, seen] = useInView(0.3);
  const sense = (e) => { const r = e.currentTarget.getBoundingClientRect(); const id = Date.now(); setPulses(ps => [...ps, { id, x: e.clientX - r.left, y: e.clientY - r.top }]); setTimeout(() => setPulses(ps => ps.filter(q => q.id !== id)), 650); };
  return (
    <div ref={ref} style={{ opacity: seen ? 1 : 0, transform: seen ? "none" : "translateY(50px) scale(0.95)", transition: "opacity .7s ease, transform .8s cubic-bezier(.2,.8,.3,1.1)" }}>
      <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)} onMouseDown={sense} style={{ position: "relative", border: `1px solid ${hov ? th.accent : `rgba(${th.node},0.1)`}`, borderRadius: 18, padding: 28, background: th.panel, transition: "border-color .3s, transform .3s, box-shadow .3s", transform: hov ? "translateY(-4px)" : "none", boxShadow: hov ? `0 24px 50px -22px ${th.accent}` : "none", overflow: "hidden" }}>
        {pulses.map(pl => <span key={pl.id} style={{ position: "absolute", left: pl.x, top: pl.y, width: 90, height: 90, marginLeft: -45, marginTop: -45, borderRadius: "50%", border: `2px solid ${th.accent}`, pointerEvents: "none", animation: "sensePulse .65s ease-out forwards", zIndex: 6 }} />)}
        {seen && <div style={{ position: "absolute", top: 16, right: 18, zIndex: 5, animation: "burstPop .5s cubic-bezier(.2,.9,.3,1.4) forwards, burstFade .6s ease 1.5s forwards", pointerEvents: "none" }}><ComicBurst label={p.burst} th={th} display={display} /></div>}
        <div style={{ position: "absolute", top: -30, left: -30, width: 130, height: 130, opacity: 0.07, backgroundImage: `radial-gradient(#fff 1.5px, transparent 1.5px)`, backgroundSize: "11px 11px" }} />
        <div style={{ borderRadius: 12, overflow: "hidden", border: `1px solid rgba(${th.node},0.1)`, marginBottom: 20, height: 124, position: "relative" }}><ProjectPreview kind={p.preview} img={p.img} th={th} /><div style={{ position: "absolute", bottom: 6, right: 9, fontFamily: mono, fontSize: 9.5, color: "#8b96b0", letterSpacing: 0.5 }}>PREVIEW</div></div>
        <div style={{ fontFamily: mono, fontSize: 12, color: th.accent, marginBottom: 6 }}>{p.n} / FEATURED</div>
        <h3 style={{ fontFamily: display, fontSize: 24, color: "#fff", margin: 0, textTransform: "uppercase", letterSpacing: -0.5, maxWidth: "82%" }}>{p.title}</h3>
        <div style={{ fontFamily: mono, fontSize: 13, color: "#8b96b0", marginTop: 5 }}>{p.sub}</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12, margin: "22px 0" }}>{p.results.map((r, i) => (<div key={i} style={{ border: `1px solid rgba(${th.node},0.1)`, borderRadius: 10, padding: "16px 10px", textAlign: "center", background: `${th.accent2}0d` }}><div style={{ fontFamily: display, fontSize: 28, color: i === 0 ? th.accent : "#fff", letterSpacing: -0.5, textShadow: i === 0 ? `0 0 18px ${th.accent}66` : "none" }}><Counter value={r.val} suffix={r.suffix} decimals={r.decimals || 0} /></div><div style={{ fontSize: 11, color: "#8b96b0", marginTop: 4, lineHeight: 1.3 }}>{r.label}</div></div>))}</div>
        <p style={{ fontSize: 14.5, lineHeight: 1.8, color: "#bcc6db", margin: "0 0 16px" }}>{p.desc}</p>
        <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginBottom: 16 }}>{p.stack.map(s => <span key={s} style={{ fontFamily: mono, fontSize: 11.5, padding: "4px 9px", borderRadius: 5, background: `${th.accent}1a`, color: "#fff", border: `1px solid ${th.accent}44` }}>{s}</span>)}</div>
        {p.demo && <ChurnDemo th={th} mono={mono} display={display} />}
        {p.caseStudy && (<div style={{ marginTop: 16 }}>
          <button onClick={() => setCaseOpen(o => !o)} style={{ background: caseOpen ? th.accent : "none", border: `1px solid ${th.accent}`, color: caseOpen ? "#fff" : th.accent, fontFamily: mono, fontSize: 13, padding: "8px 16px", borderRadius: 8, cursor: "none", fontWeight: 700, letterSpacing: 0.5 }}>{caseOpen ? "− Close Case File" : "📂 Open Case File"}</button>
          <div style={{ maxHeight: caseOpen ? 600 : 0, overflow: "hidden", transition: "max-height .5s ease, margin .5s ease", marginTop: caseOpen ? 16 : 0 }}><div style={{ display: "flex", flexDirection: "column", gap: 14 }}>{[["The Problem", p.caseStudy.problem, th.accent], ["The Approach", p.caseStudy.approach, th.accent2], ["The Result", p.caseStudy.result, "#3ecf8e"]].map(([label, text, c]) => (<div key={label} style={{ borderLeft: `3px solid ${c}`, paddingLeft: 16 }}><div style={{ fontFamily: mono, fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", color: c, fontWeight: 700, marginBottom: 6 }}>{label}</div><p style={{ fontSize: 14, lineHeight: 1.7, color: "#bcc6db", margin: 0 }}>{text}</p></div>))}</div></div>

          <button onClick={onToggle} style={{ background: "none", border: `1px solid ${th.accent2}`, color: th.accent2, fontFamily: mono, fontSize: 13, padding: "7px 14px", borderRadius: 8, cursor: "none", fontWeight: 600 }}>{open ? "− Hide Architecture" : "+ View Architecture"}</button>
          {p.links.map(([l, h]) => <a key={l} href={h} target="_blank" rel="noopener noreferrer" style={{ color: "#8b96b0", fontSize: 13, fontFamily: mono, textDecoration: "none", cursor: "none" }}>{l} ↗</a>)}
        </div>
        <div style={{ maxHeight: open ? 260 : 0, overflow: "hidden", transition: "max-height .45s ease, margin .45s ease", marginTop: open ? 20 : 0 }}><div style={{ border: `1px dashed ${th.accent2}`, borderRadius: 12, padding: "20px 16px", background: `${th.ink}88` }}><div style={{ fontFamily: mono, fontSize: 11, color: "#8b96b0", marginBottom: 14, letterSpacing: 1 }}>// PIPELINE</div><div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 8 }}>{p.arch.map((step, i) => (<div key={i} style={{ display: "flex", alignItems: "center", gap: 8 }}><div style={{ fontFamily: mono, fontSize: 12, fontWeight: 600, color: "#fff", border: `1px solid ${th.accent2}66`, background: `${th.accent2}1f`, borderRadius: 8, padding: "8px 12px", whiteSpace: "nowrap" }}>{step}</div>{i < p.arch.length - 1 && <span style={{ color: th.accent, fontSize: 14 }}>→</span>}</div>))}</div></div></div>
      </div>
    </div>
  );
}

function ComicBurst({ label, th, display }) {
  const spikes = 12, pts = [];
  for (let i = 0; i < spikes * 2; i++) { const ang = (i / (spikes * 2)) * Math.PI * 2; const r = i % 2 === 0 ? 50 : 33; pts.push(`${50 + Math.cos(ang) * r},${50 + Math.sin(ang) * r}`); }
  return (<div style={{ position: "relative", width: 90, height: 90 }}><svg viewBox="0 0 100 100" style={{ width: "100%", height: "100%", filter: `drop-shadow(0 3px 8px ${th.accent}aa)` }}><polygon points={pts.join(" ")} fill={th.accent} stroke="#fff" strokeWidth="2.5" /></svg><div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: display, fontSize: 16, color: "#fff", textTransform: "uppercase", letterSpacing: -0.5, textShadow: "1px 1px 0 rgba(0,0,0,0.35)" }}>{label}</div></div>);
}

function ContactCards({ th, mono }) {
  const [copied, setCopied] = useState(null);
  const items = [
    { l: "Email", val: DATA.email, href: `mailto:${DATA.email}`, copy: DATA.email, ext: false },
    { l: "Phone", val: "+1 (315) 728-0838", href: `tel:${DATA.phone}`, copy: "+13157280838", ext: false },
    { l: "LinkedIn", val: "aditya-marathe99", href: DATA.linkedin, ext: true },
    { l: "GitHub", val: "Aditya768", href: DATA.github, ext: true },
  ];
  const handle = (e, it) => { if (it.ext) return; e.preventDefault(); try { window.open(it.href, "_blank"); } catch (_) {} if (it.copy && navigator.clipboard) { navigator.clipboard.writeText(it.copy).then(() => { setCopied(it.l); setTimeout(() => setCopied(null), 1800); }).catch(() => {}); } };
  return (
    <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginTop: 24 }}>
      {items.map((it, idx) => (<a key={it.l} href={it.href} target={it.ext ? "_blank" : undefined} rel="noopener noreferrer" onClick={(e) => handle(e, it)} style={{ border: `1px solid rgba(${th.node},0.15)`, background: `rgba(${th.node},0.03)`, borderRadius: 10, padding: "12px 20px", color: "#fff", textDecoration: "none", fontSize: 14, fontWeight: 600, fontFamily: mono, transition: "all .25s", cursor: "none", display: "flex", flexDirection: "column", gap: 3, minWidth: 120, opacity: 0, animation: `contactPop .5s cubic-bezier(.2,.9,.3,1.3) ${idx * 0.1}s forwards` }} onMouseEnter={e => { e.currentTarget.style.borderColor = th.accent; }} onMouseLeave={e => { e.currentTarget.style.borderColor = `rgba(${th.node},0.15)`; }}><span style={{ fontSize: 10.5, letterSpacing: 1, textTransform: "uppercase", color: th.accent, fontWeight: 700 }}>{copied === it.l ? "✓ Copied!" : `${it.l} ↗`}</span><span>{it.val}</span></a>))}
    </div>
  );
}

function PowerCard({ g, mono, display, th, delay = 0 }) {
  const [hov, setHov] = useState(false); const [ref, seen] = useInView(0.25);
  return (
    <div ref={ref} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)} style={{ border: `1px solid ${hov ? th.accent : `rgba(${th.node},0.1)`}`, borderRadius: 12, padding: 18, background: `rgba(${th.node},0.025)`, opacity: seen ? 1 : 0, transform: seen ? "none" : "translateY(30px) scale(0.96)", transition: `opacity .6s ease ${delay}s, transform .6s cubic-bezier(.2,.8,.3,1.2) ${delay}s, border-color .3s, box-shadow .3s`, boxShadow: hov ? `0 16px 36px -20px ${th.accent}` : "none" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}><span style={{ fontSize: 22, lineHeight: 1, filter: hov ? `drop-shadow(0 0 8px ${th.accent})` : "none", transition: "filter .3s" }}>{g.icon}</span><span style={{ fontFamily: display, fontSize: 16, color: "#fff", textTransform: "uppercase", letterSpacing: -0.3 }}>{g.power}</span></div>
      <div style={{ fontSize: 12.5, color: "#9aa6c2", lineHeight: 1.5, marginBottom: 10, minHeight: 36 }}>{g.desc}</div>
      <div style={{ fontFamily: mono, fontSize: 10.5, textTransform: "uppercase", letterSpacing: 1, color: th.accent, fontWeight: 700, marginBottom: 10, opacity: 0.8 }}>{g.cat}</div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>{g.items.map(s => <Tag key={s} label={s} mono={mono} th={th} />)}</div>
    </div>
  );
}

function Tag({ label, mono, th }) {
  const [h, setH] = useState(false);
  return <span onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={{ fontFamily: mono, fontSize: 12, padding: "5px 10px", borderRadius: 7, cursor: "none", background: h ? `${th.accent}26` : "transparent", color: h ? "#fff" : "#bcc6db", border: `1px solid ${h ? `${th.accent}66` : `rgba(${th.node},0.12)`}`, transform: h ? "translateY(-2px) scale(1.04)" : "none", boxShadow: h ? `0 4px 14px -4px ${th.accent}` : "none", transition: "all .2s" }}>{label}</span>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Portfolio />);
  </script>
</body>
